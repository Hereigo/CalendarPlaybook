  <style type="text/css" data-vite-dev-id="C:/Users/andrii.plakhtii/source/repos/ReactAspNetApp/reactaspnetapp.client/src/index.css">:root {
    --gap: 0.5rem;
    --border: #d8dde6;
    --muted: #9aa3b0;
    --accent: #2563eb;
    --surface: #ffffff;
    --bg: #f4f6fa;
    color-scheme: light;
}

* {
    box-sizing: border-box;
}

html,
body,
#root {
    height: 100%;
}

body {
    margin: 0;
    background: var(--bg);
    color: #1f2733;
    font: 16px/1.45 'Ubuntu', system-ui, 'Segoe UI', Roboto, Arial, sans-serif;
}

button,
input {
    font-family: inherit;
}

.page {
    min-height: 100%;
    display: grid;
    grid-template-columns: 1fr 15%;
    grid-template-rows: auto 1fr;
    grid-template-areas:
        'header header'
        'main   sidebar';
    gap: var(--gap);
    padding: var(--gap);
}

.site-header {
    grid-area: header;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0 1.1rem;
    line-height: 3;
    white-space: nowrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
}

.site-header h1 {
    margin: 0;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 1.1rem;
    font-weight: 700;
}

.month-nav {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.month-nav button {
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 5px;
    padding: 0 0.3rem;
    font-size: 1.1rem;
    line-height: 1.2;
}

.month-nav button:hover {
    border-color: var(--accent);
    color: var(--accent);
}

.month-label {
    min-width: 11ch;
    text-align: center;
    font-weight: 600;
    font-size: 1.1rem;
}

.sidebar {
    grid-area: sidebar;
    min-width: 0;
    padding: 0.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
}

.sidebar h2 {
    margin: 0 0 0.5rem;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
}

.sidebar ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 0.4rem;
    font-size: 0.85rem;
    word-break: break-word;
}

.sidebar a {
    color: -webkit-link;
    color: LinkText;
}

.main {
    grid-area: main;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
}

.calendar {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: auto repeat(6, minmax(3.5rem, 1fr));
    gap: 2px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.calendar .weekday {
    background: #eef2f8;
    padding: 0.5rem 0.25rem;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #55617a;
}

.calendar .day {
    background: var(--surface);
    padding: 0.35rem 0.45rem;
    min-width: 0;
    cursor: pointer;
    overflow: hidden;
}

.calendar .day.outside {
    cursor: default;
}

.calendar .day .num {
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
}

.calendar .day.outside .num {
    color: var(--muted);
}

.calendar .day.today {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
}

.calendar .day.today .num {
    display: inline-grid;
    place-items: center;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
}

.event {
    margin-top: 2px;
    padding: 1px 4px;
    font-size: 0.75rem;
    background: var(--accent);
    color: #fff;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.editor {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    padding: 0.5rem;
}

.editor input {
    min-width: 0;
    padding: 0.25rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 5px;
}

.editor input[placeholder] {
    flex: 1;
}

.editor button {
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 5px;
    padding: 0.25rem 0.7rem;
}

.editor button:hover {
    border-color: var(--accent);
    color: var(--accent);
}

.error {
    margin: 0;
    padding: 0.5rem;
    color: #d33;
}

@media (max-width: 768px) {
    .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr;
        grid-template-areas:
            'header'
            'sidebar'
            'main';
    }

    .calendar {
        grid-template-rows: auto repeat(6, minmax(2.75rem, 1fr));
    }

    .calendar .weekday span:last-child {
        display: none;
    }

    .sidebar ul {
        grid-auto-flow: column;
        grid-auto-columns: max-content;
        overflow-x: auto;
    }
}

@media (min-width: 769px) {
    .calendar .weekday span:first-child {
        display: none;
    }
}
</style>
